name: Bug report
description: Something does not work as it should. German is fine too.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! The more precise the report, the faster we can fix it.
        Danke! Du kannst gern auf Deutsch schreiben.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the mod list or in the file name of the jar.
      placeholder: e.g. 0.8.0
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.21.11
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Other
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer (I host)
        - Multiplayer (dedicated server)
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste `logs/latest.log` or the crash report (or a link to mclo.gs).
      render: shell
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Which other mods are installed? A list is enough.
